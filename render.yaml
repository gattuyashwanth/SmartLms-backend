services:
  - type: web
    name: smartlms-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        value: mysql-1e3b0ced-smartlmsdatabase.j.aivencloud.com
      - key: DB_PORT
        value: "11037"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://*.vercel.app"
